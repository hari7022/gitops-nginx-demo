apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-test
  namespace: test-stateful
spec:
  serviceName: pg-test
  replicas: 1
  selector:
    matchLabels:
      app: pg-test
  template:
    metadata:
      labels:
        app: pg-test
    spec:
      containers:
      - name: postgres
        image: registry.redhat.io/rhel9/postgresql-15:latest
        env:
        - name: POSTGRESQL_USER
          value: testuser
        - name: POSTGRESQL_PASSWORD
          value: testpass
        - name: POSTGRESQL_DATABASE
          value: testdb
        - name: PGDATA
          value: /var/lib/pgsql/data/pgdata
        volumeMounts:
        - name: pg-data
          mountPath: /var/lib/pgsql/data
        - name: pg-wal
          mountPath: /var/lib/pgsql/wal
  volumeClaimTemplates:
  - metadata:
      name: pg-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: netapp-nas-rwx
      resources:
        requests:
          storage: 5Gi
  - metadata:
      name: pg-wal
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: netapp-nas-rwx
      resources:
        requests:
          storage: 2Gi
