apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gitops
  namespace: openshift-gitops
spec:
  destination:
    namespace: gitops-demo
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: https://github.com/hari7022/gitops-nginx-demo.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
