apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kustomize-dev
  namespace: openshift-gitops
spec:
  destination:
    namespace: nginx-dev
    server: https://kubernetes.default.svc
  project: default
  source:
    path: kustomize-demo/overlays/dev 
    repoURL: https://github.com/hari7022/gitops-nginx-demo.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
